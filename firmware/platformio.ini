; OpenCylinder firmware — development targets (ESP32-C3).
; The battery-powered production target (nRF52 or STM32L5/U5) is added later;
; hardware-specific code stays behind interfaces such as IDesfireTransport.

; Machine-specific settings (e.g. a stable serial port) go into
; platformio_local.ini — git-ignored, optional.
[platformio]
extra_configs = platformio_local*.ini

[env]
; Pinned like the libraries below: CI picked up espressif32 8.0.0 and the build
; failed; 6.13.0 is what the bench lock is built and verified with. Bump
; deliberately, after a bench test, and note it in CHANGELOG.md.
platform = espressif32 @ 6.13.0
framework = arduino
monitor_speed = 115200
; Stamps FW_VERSION (from ./VERSION) and FW_GIT (git describe) into the build.
extra_scripts = pre:scripts/version.py
; Always compile the portable libs, even before main.cpp uses them.
; External libraries are pinned to exact versions (incl. transitive deps)
; so a build is reproducible; bump deliberately and note it in CHANGELOG.md.
lib_deps =
    desfire_auth
    access_decision
    management
    eventlog
    m5stack/M5Unit-NFC @ 0.1.2
    m5stack/M5UnitUnified @ 0.6.5
    m5stack/M5Utility @ 0.3.1
    m5stack/M5HAL @ 0.1.4
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Firmware variant (docs/online-architecture.md): offline = no radio code
    ; compiled in. Online variants get their own envs (<board>-online-<carrier>).
    -DOC_VARIANT_OFFLINE=1
    -DOC_VARIANT_NAME=\"offline\"
    ; Bench-only serial commands (set time, state factory, mgmt reset, log
    ; clear, uidmode). They bypass the signed-bundle path: never in production.
    -DOC_BENCH_COMMANDS=1
    ; I2C to the ST25R3916 unit (Grove: yellow=SDA, white=SCL).
    ; GPIO6/7 on both boards: avoids the C3 strapping pins 2/8/9
    ; (on the SuperMini GPIO8 is the LED and GPIO9 the BOOT button).
    -DOC_I2C_SDA=6
    -DOC_I2C_SCL=7
    ; Bench actuator (LED + resistor or relay module, active high):
    ; GPIO4 = XIAO D2; not a strapping pin.
    -DOC_ACTUATOR_PIN=4
    ; Status RGB LED, plain (no standby current), one 330 R per colour.
    ; XIAO D1 = red, D3 = green, D10 = blue. Common cathode -> active high;
    ; set OC_LED_ACTIVE_HIGH=0 for a common-anode LED.
    -DOC_LED_R=3
    -DOC_LED_G=5
    -DOC_LED_B=10
    -DOC_LED_ACTIVE_HIGH=1

; ESP32-C3 SuperMini (generic, no own board definition)
[env:c3-supermini]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DOC_BOARD_NAME=\"c3-supermini\"

; Seeed Studio XIAO ESP32C3 (D4 = GPIO6 = SDA, D5 = GPIO7 = SCL)
[env:xiao-c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -DOC_BOARD_NAME=\"xiao-c3\"

; Same as xiao-c3, plus error/warning logs from the M5 NFC libraries
; (ISO-DEP timeouts, CRC errors, ...) for diagnosing RF problems.
[env:xiao-c3-debug]
extends = env:xiao-c3
build_flags =
    ${env:xiao-c3.build_flags}
    -DM5_LOG_LEVEL=2

; Production-style build of the same board: no bench serial commands
; (time set, state factory, mgmt reset, log clear, uidmode).
[env:xiao-c3-prod]
extends = env:xiao-c3
build_unflags = -DOC_BENCH_COMMANDS=1
