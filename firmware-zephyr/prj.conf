# Offline variant: no radio code compiled in (docs/online-architecture.md).
CONFIG_BT=n
CONFIG_IEEE802154=n
CONFIG_NET_L2_OPENTHREAD=n

# Console over the XIAO's USB serial (on-board SAMD11 bridge)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# I2C to the ST25R3916 (M5Stack Unit NFC on D4/D5)
CONFIG_I2C=y
CONFIG_GPIO=y
