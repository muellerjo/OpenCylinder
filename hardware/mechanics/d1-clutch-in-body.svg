nchor="end" font-weight="bold" fill="#a00" font-family="sans-serif">teeth meshed</text><text x="30.0" y="732.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111" font-family="sans-serif">3 · Attack: knob ripped off</text><text x="30.0" y="750.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" font-family="sans-serif">The shaft breaks at the notch inside the body. Blue and green stay separated → nothing to turn the cam with.</text><rect x="342.0" y="819.0" width="360.0" height="102.0" fill="#e0c27a" stroke="#333" stroke-width="0.8" /><rect x="342.0" y="921.0" width="360.0" height="96.0" fill="#e0c27a" stroke="#333" stroke-width="0.8" /><rect x="492.0" y="819.0" width="60.0" height="129.0" fill="#fff" stroke="#fff" stroke-width="0" /><circle cx="522.0" cy="987.0" r="15.0" fill="#fff" stroke="#333" stroke-width="0.8"/><line x1="342.0" y1="798.0" x2="342.0" y2="1032.0" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><line x1="702.0" y1="786.0" x2="702.0" y2="1032.0" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><text x="338.0" y="1044.0" font-size="10" text-anchor="end" font-weight="normal" fill="#666" font-family="sans-serif">door outside face</text><text x="706.0" y="1044.0" font-size="10" text-anchor="start" font-weight="normal" fill="#666" font-family="sans-serif">door inside face</text><text x="210.0" y="868.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#a00" font-family="sans-serif">knob gone</text><text x="210.0" y="886.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#a00" font-family="sans-serif">(broken / pulled off)</text><rect x="366.0" y="846.0" width="282.0" height="48.0" fill="#5b8fd6" stroke="#333" stroke-width="0.8" /><polyline points="366.0,846.0 369.6,858.0 364.79999999999995,870 369.6,882.0 366.0,894.0" fill="none" stroke="#a00" stroke-width="1.5"/><rect x="372.0" y="863.4" width="252.0" height="13.2" fill="#d64545" stroke="#822" stroke-width="0.6" /><rect x="624.0" y="828.0" width="9.0" height="84.0" fill="#d64545" stroke="#822" stroke-width="0.6" /><rect x="498.0" y="828.0" width="48.0" height="84.0" fill="#4caf50" stroke="#333" stroke-width="0.8" /><rect x="504.0" y="912.0" width="36.0" height="36.0" fill="#4caf50" stroke="#333" stroke-width="0.8" /><rect x="546.0" y="837.0" width="12.0" height="9.0" fill="#4caf50" stroke="#333" stroke-width="0.8" /><rect x="546.0" y="894.0" width="12.0" height="9.0" fill="#4caf50" stroke="#333" stroke-width="0.8" /><rect x="546.0" y="820.2" width="156.0" height="5.4" fill="#4caf50" stroke="#2e7d32" stroke-width="0.5" /><rect x="546.0" y="914.4" width="156.0" height="5.4" fill="#4caf50" stroke="#2e7d32" stroke-width="0.5" /><rect x="702.0" y="798.0" width="108.0" height="144.0" rx="10" fill="#4caf50" stroke="#333" stroke-width="0.8"/><rect x="576.0" y="828.0" width="36.0" height="18.0" fill="#9dbdf0" stroke="#333" stroke-width="0.8" /><rect x="564.0" y="828.0" width="12.0" height="9.0" fill="#9dbdf0" stroke="#333" stroke-width="0.8" /><rect x="576.0" y="894.0" width="36.0" height="18.0" fill="#9dbdf0" stroke="#333" stroke-width="0.8" /><rect x="564.0" y="903.0" width="12.0" height="9.0" fill="#9dbdf0" stroke="#333" stroke-width="0.8" /><polyline points="612.0,843.0 614.0,837.0 616.0,843.0 618.0,837.0 620.0,843.0 622.0,837.0 624.0,843.0" fill="none" stroke="#333" stroke-width="1"/><line x1="282.0" y1="918.0" x2="360.0" y2="882.0" stroke="#a00" stroke-width="1.5" marker-end="url(#arr)"/><text x="270.0" y="922.0" font-size="11" text-anchor="end" font-weight="normal" fill="#a00" font-family="sans-serif">push the rod? the spring keeps the gap open</text><text x="270.0" y="937.0" font-size="11" text-anchor="end" font-weight="normal" fill="#a00" font-family="sans-serif">grip the stub? it is below the surface and spins freely</text><text x="552.0" y="813.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#a00" font-family="sans-serif">gap stays open</text><text x="30.0" y="1062.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111" font-family="sans-serif">4 · For comparison — option (a), clutch in the knob: knob broken off</text><text x="30.0" y="1080.0" font-size="12" text-anchor="start" font-weight="normal" fill="#333" font-family="sans-serif">The shaft in the body is permanently fixed to the cam. What is left at the body front can be turned with a tool.</text><rect x="342.0" y="1149.0" width="360.0" height="102.0" fill="#e0c27a" stroke="#333" stroke-width="0.8" /><rect x="342.0" y="1251.0" width="360.0" height="96.0" fill="#e0c27a" stroke="#333" stroke-width="0.8" /><rect x="492.0" y="1149.0" width="60.0" height="129.0" fill="#fff" stroke="#fff" stroke-width="0" /><circle cx="522.0" cy="1317.0" r="15.0" fill="#fff" stroke="#333" stroke-width="0.8"/><line x1="342.0" y1="1128.0" x2="342.0" y2="1362.0" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><line x1="702.0" y1="1116.0" x2="702.0" y2="1362.0" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><text x="338.0" y="1374.0" font-size="10" text-anchor="end" font-weight="normal" fill="#666" font-family="sans-serif">door outside face</text><text x="706.0" y="1374.0" font-size="10" text-anchor="start" font-weight="normal" fill="#666" font-family="sans-serif">door inside face</text><rect x="498.0" y="1158.0" width="48.0" height="84.0" fill="#4caf50" stroke="#333" stroke-width="0.8" /><rect x="504.0" y="1242.0" width="36.0" height="36.0" fill="#4caf50" stroke="#333" stroke-width="0.8" /><rect x="360.0" y="1176.0" width="186.0" height="48.0" fill="#4caf50" stroke="#333" stroke-width="0.8" /><line x1="363.0" y1="1176.0" x2="363.0" y2="1224.0" stroke="#1b5e20" stroke-width="1"/><line x1="372.0" y1="1176.0" x2="372.0" y2="1224.0" stroke="#1b5e20" stroke-width="1"/><line x1="381.0" y1="1176.0" x2="381.0" y2="1224.0" stroke="#1b5e20" stroke-width="1"/><rect x="546.0" y="1150.2" width="156.0" height="5.4" fill="#4caf50" stroke="#2e7d32" stroke-width="0.5" /><rect x="546.0" y="1244.4" width="156.0" height="5.4" fill="#4caf50" stroke="#2e7d32" stroke-width="0.5" /><rect x="702.0" y="1128.0" width="108.0" height="144.0" rx="10" fill="#4caf50" stroke="#333" stroke-width="0.8"/><text x="210.0" y="1198.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#a00" font-family="sans-serif">knob gone</text><text x="210.0" y="1216.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#a00" font-family="sans-serif">(clutch was inside it)</text><line x1="282.0" y1="1248.0" x2="357.0" y2="1212.0" stroke="#a00" stroke-width="1.5" marker-end="url(#arr)"/><text x="270.0" y="1252.0" font-size="11" text-anchor="end" font-weight="normal" fill="#a00" font-family="sans-serif">the shaft end is green = fixed to the cam:</text><text x="270.0" y="1267.0" font-size="11" text-anchor="end" font-weight="bold" fill="#a00" font-family="sans-serif">a tool on its spline turns the cam → OPEN</text><rect x="30.0" y="1390.0" width="18.0" height="15.0" fill="#5b8fd6" stroke="#333" stroke-width="0.8" /><text x="60.0" y="1403.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111" font-family="sans-serif">turns with the outside knob</text><rect x="450.0" y="1390.0" width="18.0" height="15.0" fill="#4caf50" stroke="#333" stroke-width="0.8" /><text x="480.0" y="1403.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111" font-family="sans-serif">connected to the cam / bolt (and the inside thumbturn)</text><rect x="30.0" y="1412.0" width="18.0" height="15.0" fill="#d64545" stroke="#333" stroke-width="0.8" /><text x="60.0" y="1425.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111" font-family="sans-serif">control rod, moved by the motor</text><rect x="450.0" y="1412.0" width="18.0" height="15.0" fill="#e0c27a" stroke="#333" stroke-width="0.8" /><text x="480.0" y="1425.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111" font-family="sans-serif">cylinder body, fixed in the door</text></svg>