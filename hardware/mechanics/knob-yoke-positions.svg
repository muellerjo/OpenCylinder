<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a00"/></marker></defs><rect width="900" height="520" fill="#fff"/><text x="30" y="32" font-size="18" text-anchor="start" font-weight="bold" fill="#111" font-family="sans-serif">One motor, four positions (design plan §3.6)</text><text x="30" y="54" font-size="12" text-anchor="start" font-weight="normal" fill="#333" font-family="sans-serif">The motor turns a leadscrew; the nut (yoke) slides along it and stays put without current. Where it stops decides what happens.</text><line x1="170" y1="110" x2="840" y2="110" stroke="#555" stroke-width="3"/><line x1="170" y1="104" x2="174" y2="116" stroke="#888" stroke-width="1"/><line x1="178" y1="104" x2="182" y2="116" stroke="#888" stroke-width="1"/><line x1="186" y1="104" x2="190" y2="116" stroke="#888" stroke-width="1"/><line x1="194" y1="104" x2="198" y2="116" stroke="#888" stroke-width="1"/><line x1="202" y1="104" x2="206" y2="116" stroke="#888" stroke-width="1"/><line x1="210" y1="104" x2="214" y2="116" stroke="#888" stroke-width="1"/><line x1="218" y1="104" x2="222" y2="116" stroke="#888" stroke-width="1"/><line x1="226" y1="104" x2="230" y2="116" stroke="#888" stroke-width="1"/><line x1="234" y1="104" x2="238" y2="116" stroke="#888" stroke-width="1"/><line x1="242" y1="104" x2="246" y2="116" stroke="#888" stroke-width="1"/><line x1="250" y1="104" x2="254" y2="116" stroke="#888" stroke-width="1"/><line x1="258" y1="104" x2="262" y2="116" stroke="#888" stroke-width="1"/><line x1="266" y1="104" x2="270" y2="116" stroke="#888" stroke-width="1"/><line x1="274" y1="104" x2="278" y2="116" stroke="#888" stroke-width="1"/><line x1="282" y1="104" x2="286" y2="116" stroke="#888" stroke-width="1"/><line x1="290" y1="104" x2="294" y2="116" stroke="#888" stroke-width="1"/><line x1="298" y1="104" x2="302" y2="116" stroke="#888" st