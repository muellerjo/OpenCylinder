[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opencylinder-manager"
dynamic = ["version"]
description = "OpenCylinder Manager — offline-first, multi-tenant web management for OpenCylinder sites, cards and locks"
readme = "README.md"
license = { text = "see repository LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ocm = "ocmanager.cli:main"

# Third-party feature modules register here (see src/ocmanager/core/modules.py):
# [project.entry-points."ocmanager.modules"]
# myfeature = "my_package.module:MODULE"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocmanager = ["web/templates/**/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
