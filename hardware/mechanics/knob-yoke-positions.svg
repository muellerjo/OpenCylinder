>K — pushed 2</text><rect x="408" y="88" width="24" height="44" rx="3" fill="#555" stroke="#222" stroke-width="0.8"/><text x="420" y="80" font-size="11" text-anchor="middle" font-weight="normal" fill="#111" font-family="sans-serif">yoke</text><line x1="400" y1="76" x2="270" y2="76" stroke="#a00" stroke-width="1.5" marker-end="url(#arr)"/><text x="335.0" y="70" font-size="11" text-anchor="middle" font-weight="bold" fill="#a00" font-family="sans-serif">pull</text><line x1="440" y1="76" x2="570" y2="76" stroke="#a00" stroke-width="1.5" marker-end="url(#arr)"/><line x1="610" y1="76" x2="740" y2="76" stroke="#a00" stroke-width="1.5" marker-end="url(#arr)"/><text x="590.0" y="70" font-size="11" text-anchor="middle" font-weight="bold" fill="#a00" font-family="sans-serif">push</text><text x="30" y="214" font-size="13" text-anchor="start" font-weight="bold" fill="#111" font-family="sans-serif">clutch (knob ↔ cam)</text><rect x="170" y="194" width="160" height="30" rx="5" fill="#c62828" stroke="#fff" stroke-width="0.8"/><text x="250" y="214" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">ENGAGED → door opens</text><rect x="340" y="194" width="160" height="30" rx="5" fill="#2e7d32" stroke="#fff" stroke-width="0.8"/><text x="420" y="214" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">open</text><rect x="510" y="194" width="160" height="30" rx="5" fill="#2e7d32" stroke="#fff" stroke-width="0.8"/><text x="590" y="214" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">open</text><rect x="680" y="194" width="160" height="30" rx="5" fill="#2e7d32" stroke="#fff" stroke-width="0.8"/><text x="760" y="214" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">open</text><text x="30" y="258" font-size="13" text-anchor="start" font-weight="bold" fill="#111" font-family="sans-serif">outer shell (battery)</text><rect x="170" y="238" width="160" height="30" rx="5" fill="#2e7d32" stroke="#fff" stroke-width="0.8"/><text x="250" y="258" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">locked</text><rect x="340" y="238" width="160" height="30" rx="5" fill="#2e7d32" stroke="#fff" stroke-width="0.8"/><text x="420" y="258" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">locked</text><rect x="510" y="238" width="160" height="30" rx="5" fill="#ef6c00" stroke="#fff" stroke-width="0.8"/><text x="590" y="258" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">RELEASED</text><rect x="680" y="238" width="160" height="30" rx="5" fill="#ef6c00" stroke="#fff" stroke-width="0.8"/><text x="760" y="258" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">RELEASED</text><text x="30" y="302" font-size="13" text-anchor="start" font-weight="bold" fill="#111" font-family="sans-serif">knob on the cylinder</text><rect x="170" y="282" width="160" height="30" rx="5" fill="#2e7d32" stroke="#fff" stroke-width="0.8"/><text x="250" y="302" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">locked</text><rect x="340" y="282" width="160" height="30" rx="5" fill="#2e7d32" stroke="#fff" stroke-width="0.8"/><text x="420" y="302" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">locked</text><rect x="510" y="282" width="160" height="30" rx="5" fill="#2e7d32" stroke="#fff" stroke-width="0.8"/><text x="590" y="302" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">locked</text><rect x="680" y="282" width="160" height="30" rx="5" fill="#ef6c00" stroke="#fff" stroke-width="0.8"/><text x="760" y="302" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">RELEASED</text><text x="30" y="346" font-size="13" text-anchor="start" font-weight="bold" fill="#111" font-family="sans-serif">card needed</text><rect x="170" y="326" width="160" height="30" rx="5" fill="#eceff1" stroke="#fff" stroke-width="0.8"/><text x="250" y="346" font-size="12" text-anchor="middle" font-weight="bold" fill="#263238" font-family="sans-serif">user card with access</text><rect x="340" y="326" width="160" height="30" rx="5" fill="#eceff1" stroke="#fff" stroke-width="0.8"/><text x="420" y="346" font-size="12" text-anchor="middle" font-weight="bold" fill="#263238" font-family="sans-serif">— (normal state)</text><rect x="510" y="326" width="160" height="30" rx="5" fill="#eceff1" stroke="#fff" stroke-width="0.8"/><text x="590" y="346" font-size="12" text-anchor="middle" font-weight="bold" fill="#263238" font-family="sans-serif">battery-change right</text><rect x="680" y="326" width="160" height="30" rx="5" fill="#eceff1" stroke="#fff" stroke-width="0.8"/><text x="760" y="346" font-size="12" text-anchor="middle" font-weight="bold" fill="#263238" font-family="sans-serif">disassembly right</text><text x="30" y="396" font-size="12" text-anchor="start" font-weight="normal" fill="#333" font-family="sans-serif">• After E the motor goes back to R when the engagement time (1–15 s) is over. After C or K it goes back to R with the next</text><text x="30" y="416" font-size="12" text-anchor="start" font-weight="normal" fill="#333" font-family="sans-serif">  authorised card (or a timeout) — the shell must be back on first (shell sensor).</text><text x="30" y="436" font-size="12" text-anchor="start" font-weight="normal" fill="#333" font-family="sans-serif">• The clutch spring keeps the clutch open in C and K: releasing the shell or the knob never lets the knob turn the cam.</text><text x="30" y="456" font-size="12" text-anchor="start" font-weight="normal" fill="#333" font-family="sans-serif">• Two Hall sensors (magnet on the yoke) confirm each position; if a position is not reached → retry, log, clutch stays open.</text><text x="30" y="476" font-size="12" text-anchor="start" font-weight="normal" fill="#333" font-family="sans-serif">• Knob retention: balls held by a sleeve on the yoke (or a bayonet) — mounting just snaps in, removal only in K.</text></svg>