{% extends "base.html" %}
{% block title %}Log in · OpenCylinder Manager{% endblock %}
{% block body %}
<div class="center">
  <form class="panel login" method="post" action="/login">
    <div class="brand"><span class="dot"></span> OpenCylinder Manager</div>
    {% for kind, msg in messages %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="u">User name</label><input id="u" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button>Log in</button>
    <p class="muted small">Runs locally — no data leaves this {{ "computer" if settings.mode == "local" else "server" }}.</p>
  </form>
</div>
{% endblock %}
